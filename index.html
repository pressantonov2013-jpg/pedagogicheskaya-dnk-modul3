<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Педагогическая ДНК. Модуль 3</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#25324a; --ink-soft:#4a5d77; --teal:#10c9a5; --blue:#1aa6d8; --gold:#f6c244; --gold-d:#d19a22;
  --mint:#f0fcf9; --mint-b:#cdeee7; --pink:#ff8fa8;
  --f:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--f);color:var(--ink);background:#fff;overflow-x:hidden;line-height:1.45}
button,input,textarea{font-family:inherit}
.hero-bg{position:absolute;left:0;top:0;width:100%;height:430px;z-index:0;pointer-events:none;
  background:linear-gradient(120deg,#0fd9a7 0%,#16bdc4 45%,#1f9fdb 100%);clip-path:ellipse(92% 100% at 0% 0%)}
.hero-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 85% 15%,rgba(255,255,255,.18),transparent 70%)}
.page{position:relative;overflow:hidden}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 16px 50px}
.top{color:#fff;margin-bottom:14px}
.site{display:inline-block;font-weight:800;font-size:15px;color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);padding:6px 14px;border-radius:999px}
.ribbon{display:block;width:fit-content;max-width:100%;margin:14px 0 12px;background:linear-gradient(90deg,#f8d36b,#f2b94a);color:var(--ink);font-weight:700;font-size:14px;padding:8px 26px 8px 14px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
h1{margin:0;font-weight:900;font-size:clamp(28px,5vw,48px);line-height:1.04;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(10,80,120,.18)}
.lead{margin:8px 0 0;font-size:clamp(15px,1.6vw,18px);font-weight:500;color:#effffb}
.steps{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.steps span{background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
.steps span.on{background:#fff;color:var(--ink)}
.steps span.done{background:rgba(255,255,255,.4)}
.card{background:#fff;border:2px solid var(--mint-b);border-radius:24px;box-shadow:0 12px 30px rgba(20,120,150,.14);padding:22px;margin-top:16px}
h2{margin:0 0 6px;font-size:clamp(20px,3.5vw,26px);font-weight:900}
h3{margin:0 0 8px;font-size:17px;font-weight:800}
p{margin:6px 0}
.muted{color:var(--ink-soft)}.small{font-size:13px}
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,#ffe38a,#f6bf3f);box-shadow:0 5px 0 var(--gold-d);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--gold-d)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
.btn.go{color:#fff;background:linear-gradient(180deg,#25dcb8,#10b896);box-shadow:0 5px 0 #0b8a70}
.btn.go:hover{box-shadow:0 7px 0 #0b8a70}.btn.go:active{box-shadow:0 2px 0 #0b8a70}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--mint-b)}
.btn:disabled{background:#e3e9ee;color:#98a6b5;box-shadow:none;cursor:not-allowed;transform:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.cnt{background:var(--mint);border:2px solid var(--mint-b);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}

/* таблица */
.tbl{margin-top:12px;border:2px solid var(--mint-b);border-radius:18px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 130px 150px;align-items:center;border-bottom:1px solid var(--mint-b)}
.tr:last-child{border-bottom:0}
.tr.h{background:linear-gradient(90deg,#e6fbf6,#e3f4fc);font-weight:800;font-size:13px;text-align:center}
.tr.h div:first-child{text-align:left}
.tr>div{padding:10px 12px}
.nm{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.nm i{font-style:normal;font-size:24px}
.nm span{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.tg{width:100%;border:2px solid var(--mint-b);background:#fff;border-radius:12px;padding:9px 4px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink-soft);transition:.12s}
.tg:hover{border-color:var(--teal)}
.tg.can.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tg.want.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.gh{background:var(--mint);font-weight:900;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--mint-b)}
.gh2{font-weight:900;font-size:15px;margin:16px 0 0}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add input{flex:1;min-width:200px}
input[type=text],textarea{width:100%;border:2px solid var(--mint-b);border-radius:14px;padding:10px 12px;font-size:15px;color:var(--ink);background:#fff}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--teal)}

/* приоритет */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.pk{position:relative;text-align:left;border:2px solid var(--mint-b);background:#fff;border-radius:16px;padding:12px 12px 12px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--ink);transition:.12s}
.pk:hover{border-color:var(--teal);transform:translateY(-1px)}
.pk i{font-style:normal;font-size:26px;line-height:1}
.pk b{display:block;font-size:14px;padding-right:30px}.pk span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.pk.on{border-color:var(--gold);background:#fff9e6}
.pk .rk{position:absolute;right:10px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:14px}
.pk.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tags{display:flex;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff}
.tag.can{background:var(--teal)}.tag.want{background:#e0a21d}

/* итог */
.fin{border:3px solid var(--teal);border-radius:26px;padding:20px;background:#fff}
.fin .hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--mint-b);padding-bottom:10px;margin-bottom:14px}
.fin .hd h2{margin:0}
.who{text-align:right;font-weight:800}
.grp{margin-top:14px}
.grp h4{margin:0 0 6px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.br{display:grid;grid-template-columns:30px minmax(140px,1.1fr) 2fr 56px;gap:10px;align-items:center;margin-top:6px}
.br .n{font-weight:900;color:var(--ink-soft);text-align:center}
.br .t{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.br .tk{background:#eef3f6;border-radius:999px;height:20px;overflow:hidden}
.br .fl{height:100%;border-radius:999px;display:block}
.br .pc{font-weight:900;text-align:right}
.g1 .fl{background:linear-gradient(90deg,#25dcb8,#10b896)}
.g2 .fl{background:linear-gradient(90deg,#4fc6e8,#1aa6d8)}
.g3 .fl{background:linear-gradient(90deg,#c5d3de,#9fb2c2)}
.match{display:flex;gap:16px;align-items:center;background:var(--mint);border:2px solid var(--mint-b);border-radius:20px;padding:14px 16px;margin-top:16px;flex-wrap:wrap}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#e3e9ee 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}
.note{background:#fff9e6;border-left:5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){
  .hero-bg{height:400px;clip-path:ellipse(190% 100% at 0% 0%)}
  .tr{grid-template-columns:1fr 1fr;}
  .tr>div:first-child{grid-column:1/-1;padding-bottom:2px}
  .tr.h{display:none}
  .tr>div{padding:6px 10px}
  .tr>div:last-child{padding-bottom:10px}
  .br{grid-template-columns:24px 1fr 48px}
  .br .tk{grid-column:1/-1;order:5}
  .card{padding:16px}.fin{padding:14px}
  .who{text-align:left}
}
@media print{
  body *{visibility:hidden}
  #card,#card *{visibility:visible}
  #card{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<div class="page">
<div class="hero-bg"></div>
<div class="app">
  <div class="top">
    <a class="site" href="https://lingvapolka.ru" target="_blank" rel="noopener">lingvapolka.ru</a>
    <span class="ribbon">Модуль 3. Компетенции современного учителя</span>
    <h1>🧬 Педагогическая ДНК</h1>
    <p class="lead">Что вы умеете, чему хотите научиться и каким должен быть идеальный учитель</p>
    <div class="steps" id="steps"></div>
  </div>
  <div id="main"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const G=[['g1','📚 Знания и материалы'],['g2','🛠️ Методика и работа на уроке'],['g3','🤝 Люди и отношения'],['g4','🔭 Мышление и развитие'],['own','⭐ Мои компетенции']];
const C=[
 {g:'g1',id:'sub',ic:'📚',n:'Предметные знания',d:'глубоко знать свой предмет (русский язык, РКИ)'},
 {g:'g1',id:'std',ic:'📜',n:'Знание стандартов',d:'ФГОС, профессиональный стандарт, международные рамки'},
 {g:'g1',id:'psy',ic:'🧒',n:'Знание психологии учеников',d:'возраст, зона ближайшего развития (Выготский)'},
 {g:'g1',id:'mat',ic:'🧰',n:'Учебные материалы',d:'создавать и подбирать тексты, задания, ресурсы'},
 {g:'g2',id:'met',ic:'📐',n:'Методическая',d:'планирование урока, технологическая карта'},
 {g:'g2',id:'dif',ic:'🧩',n:'Индивидуализация',d:'разноуровневые задания, учёт особенностей ученика'},
 {g:'g2',id:'dia',ic:'🧪',n:'Диагностика',d:'определять уровень понимания учеников (Блюм)'},
 {g:'g2',id:'fdb',ic:'🎯',n:'Обратная связь',d:'конкретная и своевременная оценка'},
 {g:'g2',id:'cls',ic:'🏫',n:'Управление классом',d:'правила, порядок, безопасная атмосфера'},
 {g:'g2',id:'dig',ic:'💻',n:'Цифровая',d:'платформы, интерактив, цифровые инструменты'},
 {g:'g2',id:'flx',ic:'🔀',n:'Гибкость',d:'менять стратегию по ситуации'},
 {g:'g3',id:'com',ic:'💬',n:'Коммуникативная',d:'ясно объяснять, слушать, вести диалог'},
 {g:'g3',id:'emo',ic:'❤️',n:'Эмоциональный интеллект',d:'чувствовать состояние учеников (Песталоцци)'},
 {g:'g3',id:'cul',ic:'🌍',n:'Межкультурная',d:'работа в многоязычной группе'},
 {g:'g3',id:'col',ic:'🤝',n:'Сотрудничество',d:'работа с коллегами, родителями, командой'},
 {g:'g3',id:'mot',ic:'✨',n:'Умение вдохновлять',d:'зажигать интерес к учёбе (Дьюи)'},
 {g:'g3',id:'val',ic:'🕊️',n:'Ценностная',d:'воспитывать через культуру и личный пример'},
 {g:'g4',id:'crt',ic:'🧠',n:'Критическое мышление',d:'учить сомневаться и аргументировать'},
 {g:'g4',id:'res',ic:'🔬',n:'Исследовательская',d:'опираться на доказательства (Хэтти)'},
 {g:'g4',id:'ref',ic:'🪞',n:'Рефлексия',d:'разбирать свои уроки (Дьюи)'},
 {g:'g4',id:'edu',ic:'🌱',n:'Самообразование',d:'учиться всю жизнь, повышать квалификацию'},
 {g:'g4',id:'phe',ic:'🌊',n:'Междисциплинарность',d:'явление глазами разных предметов (Лонка)'},
 {g:'g4',id:'exp',ic:'🚀',n:'Высокие ожидания',d:'амбициозные цели и ответственность за прогресс'},
 {g:'g4',id:'obs',ic:'🔭',n:'Наблюдательность',d:'видеть каждого ученика (Монтессори)'}
];
const W=[18,16,15,13,11,9,7,5,4,2];  // вес места 1..10, сумма 100
const S={can:new Set(),want:new Set(),order:[],name:''};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const get=id=>C.find(c=>c.id===id);
let PREV=null;try{PREV=JSON.parse(localStorage.getItem('pedDNA_m3b')||'null')}catch(e){}
let scr='intro';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function steps(){const k=scr==='intro'?0:scr==='t1'?1:scr==='t2'?2:3;
  $('#steps').innerHTML=['1. Я умею и хочу','2. Идеальный учитель','3. Итог'].map((t,i)=>`<span class="${k===i+1?'on':k>i+1?'done':''}">${t}</span>`).join('')}
function go(s){scr=s;steps();R[s]();window.scrollTo({top:0,behavior:'smooth'})}
const R={};

R.intro=()=>{$('#main').innerHTML=`<div class="card">
  <h2>Два простых задания</h2>
  <p><b>1. Моя ДНК.</b> В таблице отметьте, какими компетенциями вы <b>уже обладаете</b> и чему <b>хотите научиться</b>. Если чего-то нет в списке, добавьте своё.</p>
  <p><b>2. Идеальный учитель.</b> Выберите 10 самых необходимых компетенций по порядку: от самой важной к менее важной. Игра соберёт идеального учителя и покажет, насколько вы на него похожи.</p>
  ${PREV?`<div class="note">🕰️ В прошлый раз (${esc(PREV.date)}) вы совпали с идеалом на <b>${PREV.pct}%</b>. Посмотрим, что изменилось.</div>`:''}
  <div class="bar"><span class="muted small">Займёт около 10 минут</span><button class="btn go" data-a="start">Начать →</button></div></div>`};

R.t1=()=>{
  const row=c=>`<div class="tr"><div class="nm"><i>${c.ic}</i><div>${esc(c.n)}<span>${esc(c.d)}</span></div></div>
   <div><button class="tg can ${S.can.has(c.id)?'on':''}" data-a="can" data-v="${c.id}">${S.can.has(c.id)?'✅ Умею':'Умею'}</button></div>
   <div><button class="tg want ${S.want.has(c.id)?'on':''}" data-a="want" data-v="${c.id}">${S.want.has(c.id)?'🌱 Хочу':'Хочу научиться'}</button></div></div>`;
  $('#main').innerHTML=`<div class="card"><h2>Моя педагогическая ДНК</h2>
  <p class="muted">Отметьте честно. Можно отметить обе кнопки: «умею, но хочу прокачать».</p>
  <div class="tbl"><div class="tr h"><div>Компетенция</div><div>Что я умею</div><div>Чему хочу научиться</div></div>${G.map(g=>{const l=C.filter(c=>c.g===g[0]);return l.length?`<div class="gh">${g[1]}</div>`+l.map(row).join(''):''}).join('')}</div>
  <div class="add"><input type="text" id="own" maxlength="40" placeholder="Добавить свою компетенцию…"><button class="btn ghost" data-a="addown">+ Добавить</button></div>
  <div class="bar"><span class="cnt" id="c1"></span><button class="btn go" id="n1" data-a="t2" disabled>Дальше →</button></div></div>`;
  chk()};

R.t2=()=>{
  const n=S.order.length;
  const pk=c=>{const k=S.order.indexOf(c.id);
    return `<button class="pk ${k>=0?'on':''}" data-a="rank" data-v="${c.id}"><i>${c.ic}</i><div><b>${esc(c.n)}</b><span>${esc(c.d)}</span><div class="tags">${S.can.has(c.id)?'<span class="tag can">умею</span>':''}${S.want.has(c.id)?'<span class="tag want">хочу</span>':''}</div></div>${k>=0?`<em class="rk">${k+1}</em>`:''}</button>`};
  $('#main').innerHTML=`<div class="card"><h2>Соберите идеального учителя</h2>
  <p>Нажимайте на компетенции <b>по порядку важности</b>: сначала самая необходимая, потом следующая. Нужно выбрать <b>10</b> из 24. Нажмите на выбранную, чтобы убрать её.</p>
  ${G.map(g=>{const l=C.filter(c=>c.g===g[0]);return l.length?`<div class="gh2">${g[1]}</div><div class="pgrid">${l.map(pk).join('')}</div>`:''}).join('')}
  <div class="bar"><button class="btn ghost" data-a="t1">← К таблице</button><span class="cnt">Выбрано: ${n} из 10</span><button class="btn go" data-a="final" ${n===10?'':'disabled'}>Показать учителя →</button></div></div>`};

function pctMatch(){return S.order.reduce((a,id,i)=>a+(S.can.has(id)?W[i]:0),0)}
R.final=()=>{
  const dt=new Date().toLocaleDateString('ru-RU'),pct=pctMatch();
  const groups=[['g1','🏆 Самое важное',0,3],['g2','⭐ Среднее',3,7],['g3','📌 Менее важное',7,10]];
  const line=i=>{const c=get(S.order[i]);
    return `<div class="br"><div class="n">${i+1}</div><div class="t">${c.ic} ${esc(c.n)}${S.can.has(c.id)?' <span class="tag can">умею</span>':S.want.has(c.id)?' <span class="tag want">хочу</span>':''}</div><div class="tk"><span class="fl" style="width:${W[i]/18*100}%"></span></div><div class="pc">${W[i]}%</div></div>`};
  const gap=S.order.filter(id=>!S.can.has(id)).slice(0,3);
  const verdict=pct>=75?'Вы близки к идеалу: главное у вас уже есть.':pct>=45?'Хорошая основа: ключевые компетенции есть, часть ещё предстоит освоить.':'Много точек роста. Это хороший старт: вы знаете, куда двигаться.';
  const wantTop=gap.filter(id=>S.want.has(id));
  const note=gap.length?`🌱 В первую очередь стоит прокачать: <b>${gap.map(id=>esc(get(id).n.toLowerCase())).join(', ')}</b>.${wantTop.length<gap.length?' Вы их пока не отметили как «хочу научиться»: возможно, пора.':' Вы сами хотите этому научиться, отличное совпадение.'}`:'🎉 Все 10 компетенций идеального учителя у вас уже есть!';
  const own=[...S.can].filter(id=>!S.order.includes(id));
  $('#main').innerHTML=`<div class="card fin" id="card">
   <div class="hd"><div><div class="small muted" style="font-weight:700">Модуль 3. Компетенции современного учителя</div><h2>🧬 Мой идеальный учитель</h2></div><div class="who"><div id="cn">${esc(S.name)||'Имя преподавателя'}</div><div class="small muted">${dt}</div></div></div>
   ${groups.map(g=>`<div class="grp ${g[0]}"><h4>${g[1]}</h4>${Array.from({length:g[3]-g[2]},(_,k)=>line(g[2]+k)).join('')}</div>`).join('')}
   <div class="match"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><b>Я похож(а) на идеального учителя на ${pct}%</b><div class="small muted">${verdict}</div>${PREV?`<div class="small">В прошлый раз: ${PREV.pct}%</div>`:''}</div></div>
   <div class="note">${note}</div>
   <p class="small" style="margin-top:12px"><b>🧬 Моя ДНК:</b> умею: ${[...S.can].map(id=>esc(get(id).n)).join(', ')||'—'}.<br><b>Хочу научиться:</b> ${[...S.want].map(id=>esc(get(id).n)).join(', ')||'—'}.</p>
  </div>
  <div class="card noprint" style="text-align:center"><h2>🎓 Учитель собран!</h2>
   <p class="muted">Введите имя, чтобы оно появилось на карте. Затем <b>сделайте скриншот</b> и отправьте куратору, либо сохраните в PDF.</p>
   <div style="max-width:380px;margin:12px auto"><input type="text" id="nm" placeholder="Ваше имя и фамилия" value="${esc(S.name)}"></div>
   <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn" data-a="pdf">🖨️ Сохранить в PDF</button><button class="btn ghost" data-a="copy">📋 Скопировать текстом</button><button class="btn ghost" data-a="again">↺ Заново</button></div>
   <p class="small muted" style="margin-top:12px">Результат запоминается на этом устройстве. Пройдите игру снова через полгода и сравните.</p></div>`;
  try{localStorage.setItem('pedDNA_m3b',JSON.stringify({date:dt,pct}))}catch(e){}
};

function chk(){if(scr!=='t1')return;
  $('#c1').textContent=`Умею: ${S.can.size} · Хочу научиться: ${S.want.size}`;
  $('#n1').disabled=!(S.can.size>=3&&S.want.size>=1)}
function text(){const L=['Мой идеальный учитель. Модуль 3'+(S.name?' · '+S.name:'')];
  S.order.forEach((id,i)=>L.push((i+1)+'. '+get(id).n+' — '+W[i]+'%'+(S.can.has(id)?' (умею)':'')));
  L.push('Похож(а) на идеал на '+pctMatch()+'%');
  L.push('Умею: '+[...S.can].map(i=>get(i).n).join(', '));L.push('Хочу научиться: '+[...S.want].map(i=>get(i).n).join(', '));
  return L.join('\n')}
function act(a,v){switch(a){
  case 'start':case 't1':go('t1');break;
  case 'can':case 'want':{const s=S[a];s.has(v)?s.delete(v):s.add(v);R.t1();break}
  case 'addown':{const i=$('#own'),t=i.value.trim();if(t.length<3){toast('Напишите название компетенции');return}
    if(C.length>=34){toast('Достаточно, уже много');return}
    const id='own'+C.length;C.push({g:'own',id,ic:'⭐',n:t[0].toUpperCase()+t.slice(1),d:'ваша компетенция'});S.can.add(id);R.t1();toast('Добавлено, она отмечена как «умею»');break}
  case 't2':go('t2');break;
  case 'rank':{const i=S.order.indexOf(v);
    if(i>=0)S.order.splice(i,1);else if(S.order.length>=10){toast('Уже выбрано 10: уберите одну');return}else S.order.push(v);
    R.t2();break}
  case 'final':go('final');break;
  case 'pdf':window.print();break;
  case 'copy':{const t=text();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Скопировано ✓')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Скопировано ✓')}catch(e){toast('Не удалось скопировать')}x.remove()});break}
  case 'again':if(confirm('Начать заново?')){S.can.clear();S.want.clear();S.order=[];S.name='';go('intro')}break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value;const c=$('#cn');if(c)c.textContent=S.name.trim()||'Имя преподавателя'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='own')act('addown')});
go('intro');
</script>
</body>
</html>
